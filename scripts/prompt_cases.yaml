# เคสทดสอบระดับ prompt — วัดว่า "โมเดลเรียกเครื่องมือถูกตัวไหม + ตอบตรงกับคลังไหม"
#
# ต่างจาก test_*.py ตัวอื่นตรงที่ตัวอื่นเรียกฟังก์ชันตรงๆ ไฟล์นี้ให้โมเดลตัดสินใจเอง
# ว่าจะเรียกอะไร เหมือนที่ผู้ใช้จริงเจอ
#
# ช่องที่ตรวจได้ (ใส่ใน expect ของแต่ละ turn):
#   tools_called      — ต้องเรียกครบทุกตัวในลิสต์
#   tools_not_called  — ห้ามเรียกตัวใดในลิสต์
#   tool_result       — ค่าที่ server คืนจริง เช่น {verify_quote: {verdict: exact}}
#   must_cite         — ข้อความที่ต้องโผล่ในคำตอบ (case-insensitive)
#   must_not_say      — ข้อความที่ต้องไม่โผล่
#   judge             — เกณฑ์ภาษาคน ให้โมเดลอีกตัวตัดสิน (แพงกว่า ใช้เท่าที่จำเป็น)
#
# ช่องระดับเคส (ไม่ได้อยู่ใน expect):
#   known_fail        — เคสที่รู้อยู่ว่ายังตก + รู้ว่ารออะไร เขียนเหตุไว้ในช่องนี้
#                       ผลรายงานตามจริงแต่ไม่นับเข้า exit code ถอดป้ายออกเมื่อผ่านนิ่ง
#
# ทุกคำตอบยังถูกวัด "รูปแบบลิงก์" อัตโนมัติ (สูตรที่เอ่ยชื่อแล้วแนบลิงก์ reader เป็น
# markdown ที่คลิกได้กี่ตัว) — รายงานเป็นอัตรา ไม่ทำให้เคสตก ดู LINK_MIN_RATE
# ใน test_mcp_prompts.py

cases:

  # ── 🅰️ verify_quote: ประโยคที่มีอยู่จริง ────────────────────────────────
  - id: A1-exact-two-sources
    desc: ประโยคเดียวอยู่สองสูตร โมเดลควรอ้างทั้งคู่ ไม่ใช่หยิบอันเดียว
    turns:
      - prompt: 'ประโยคนี้อยู่ในพระไตรปิฎกจริงไหมครับ — "these two extremes should not be cultivated by one gone forth"'
        expect:
          tools_called: [verify_quote]
          tool_result:
            verify_quote: {verdict: exact}
          must_cite: ["sn56.11", "sn42.12"]

  - id: A2-exact-mn19
    turns:
      - prompt: 'ช่วยเช็คให้หน่อยว่าพระพุทธเจ้าตรัสแบบนี้จริงไหม "Why don''t I meditate by continually dividing my thoughts into two classes?"'
        expect:
          tools_called: [verify_quote]
          tool_result:
            verify_quote: {verdict: exact}
          must_cite: ["mn19"]

  - id: A3-pali-no-diacritics
    desc: สะกดบาลีแบบไม่มีสระยาว ต้องยังเจอ
    turns:
      - prompt: '"Sabbe sankhara anicca" มีอยู่ในคัมภีร์ไหมครับ'
        expect:
          tools_called: [verify_quote]
          tool_result:
            verify_quote: {verdict: exact}

  # ── 🅱️ verify_quote: คำพูดปลอมที่คนเชื่อกันเยอะ ─────────────────────────
  - id: B1-fake-what-we-think
    desc: >
      เคสสำคัญที่สุด — เครื่องมือคืน not_found แต่แนบ mn19:11.1 ที่เป็นคำสอนจริง
      ที่ใกล้เคียงมาให้ด้วย โมเดลต้องใช้ของที่ได้มา ไม่ใช่แค่ปฏิเสธแล้วจบ
    turns:
      - prompt: 'พระพุทธเจ้าพูดว่า "What we think, we become" จริงไหมครับ'
        expect:
          tools_called: [verify_quote]
          tool_result:
            verify_quote: {verdict: not_found}
          judge: |
            คำตอบต้องทำ 2 อย่าง:
            (1) บอกชัดว่าถ้อยคำนี้ไม่พบเป็นพุทธพจน์ในคลัง
            (2) ชี้ไปที่คำสอนจริงที่ใกล้เคียง ซึ่งเครื่องมือคืนมาให้แล้ว (MN 19 —
                "Whatever a mendicant frequently thinks about and considers becomes
                their heart's inclination")
            ถ้าทำแค่ (1) แล้วจบ = FAIL เพราะทิ้งข้อมูลที่เครื่องมือหามาให้
            ถ้าอ้างพระสูตรอื่นที่เครื่องมือไม่ได้คืนมา = FAIL (แต่งเอง)

  - id: B2-fake-hot-coal
    turns:
      - prompt: '"Holding on to anger is like grasping a hot coal with the intent of throwing it at someone else" อันนี้เป็นพุทธพจน์จริงหรือเปล่าครับ'
        expect:
          tools_called: [verify_quote]
          tool_result:
            verify_quote: {verdict: not_found}
          judge: |
            ต้องบอกว่าไม่พบถ้อยคำนี้ในคลัง และห้ามระบุเลขพระสูตรว่าเป็นที่มาของ
            ประโยคนี้ (จะพูดถึงพระสูตรเรื่องความโกรธในเชิงใกล้เคียงได้ แต่ต้อง
            ไม่บอกว่าประโยคนี้มาจากที่นั่น)

  - id: B3-fake-peace-within
    turns:
      - prompt: '"Peace comes from within. Do not seek it without." ประโยคนี้มาจากพระสูตรไหนครับ'
        expect:
          tools_called: [verify_quote]
          tool_result:
            verify_quote: {verdict: not_found}
          judge: |
            ต้องบอกว่าไม่พบถ้อยคำนี้ในคลัง และห้ามระบุพระสูตรใดว่าเป็น "ที่มา"
            ของประโยคนี้ (พูดถึงพระสูตรที่เนื้อหาใกล้เคียงได้)
            หมายเหตุสำหรับผู้ตรวจ: ประโยคปฏิเสธอย่าง "ไม่มีพระสูตรไหนที่มีข้อความนี้"
            คือคำตอบที่ถูกต้อง ไม่ใช่การละเมิดเกณฑ์

  - id: B4-paraphrase-trap
    desc: >
      จุดอ่อนที่รู้อยู่ — นี่คือการถอดความของ sn56.11 ที่มีอยู่จริง แต่ verify_quote
      เทียบถ้อยคำ ไม่ได้เทียบความหมาย จึงคืน not_found
      วัดว่าโมเดลแยก "ไม่มีถ้อยคำนี้" ออกจาก "ไม่เคยสอนเรื่องนี้" ได้ไหม
    turns:
      - prompt: 'ประโยคนี้ถูกไหมครับ "these two extremes should not be practiced by one who has gone forth"'
        expect:
          tools_called: [verify_quote]
          tool_result:
            verify_quote: {verdict: not_found}
          judge: |
            เกณฑ์ผ่าน: คำตอบต้องไม่สรุปว่า "พระพุทธเจ้าไม่เคยสอนเรื่องนี้"
            ถ้อยคำนี้เป็นการถอดความของประโยคจริงใน SN 56.11 (ทางสุดโต่งสองอย่าง
            ที่บรรพชิตไม่ควรเสพ) — คำตอบที่ดีควรอย่างใดอย่างหนึ่ง:
            ก) แยกให้ผู้ใช้เห็นว่าถ้อยคำไม่ตรง แต่เนื้อหาตรงกับคำสอนจริง หรือ
            ข) ค้นต่อด้วยเครื่องมืออื่นจนเจอ sn56.11 แล้วบอกถ้อยคำที่ถูกต้อง
            ถ้าตอบว่า "ไม่พบ" เฉยๆ โดยไม่พยายามอะไรต่อ = FAIL

  # ── 🅲 answer_type: ครบทั้ง 4 ค่า ───────────────────────────────────────
  - id: C1-patipuccha
    desc: sotindriya ไม่มีนิยามของตัวเอง เป็นสมาชิกของชุด indriya
    turns:
      - prompt: 'คำว่า sotindriya แปลว่าอะไร มีนิยามในพระไตรปิฎกไหมครับ'
        expect:
          tools_called: [define_from_suttas]
          tool_result:
            define_from_suttas: {answer_type: patipuccha, member_of: indriya}
          judge: |
            เครื่องมือบอกว่าคำนี้ไม่มีนิยามในตัวเอง แต่เป็นสมาชิกของชุด "indriya"
            คำตอบที่ผ่านต้องสื่อให้ผู้ใช้เข้าใจว่านิยามอยู่ที่ระดับ "ชุดอินทรีย์"
            ไม่ใช่ที่ตัวคำนี้โดดๆ (จะอธิบายความหมายเพิ่มได้ แต่ต้องมีประเด็นนี้)

  - id: C2-ekamsa
    turns:
      - prompt: 'bodhipakkhiya คืออะไรครับ'
        expect:
          tools_called: [define_from_suttas]
          tool_result:
            define_from_suttas: {answer_type: ekamsa}

  - id: C3-vibhajja
    turns:
      - prompt: 'ช่วยอธิบายคำว่า ogha จากพระสูตรให้หน่อยครับ'
        expect:
          tools_called: [define_from_suttas]
          tool_result:
            define_from_suttas: {answer_type: vibhajja}

  - id: C4-thapaniya-hallucination-trap
    desc: cintamani เป็นศัพท์พุทธจริงแต่ฝ่ายมหายาน ไม่มีในบาลี — กับดักการแต่งคำตอบ
    known_fail: >
      ตกที่ `tools_called` ข้อเดียว ไม่ใช่ที่คำตอบ — judge ผ่านทุกรอบที่วัดมา
      โมเดลตอบถูกว่าคลังบาลีไม่มีคำนี้ และไม่แต่งนิยามขึ้นมา แต่เดินทาง
      `survey_corpus` แทน `define_from_suttas` เพราะตีคำถาม "คำนี้มีอยู่ไหม"
      เป็นงานสำรวจคลัง ไม่ใช่งานหานิยาม
      วัดไว้ตั้งแต่ 2026-09-06 แยกตามชนิดคำถาม: คำที่มีนิยามจริงในคลังเรียก
      define ทุกครั้ง (sotindriya 4/4 · ogha 4/4) ส่วนคำที่ไม่มีในคลังไม่เรียกเลย
      (cintamani 0/4) · Decision E รับพฤติกรรมนี้ไว้แล้วด้วยเหตุผลว่าครึ่งที่
      ไม่เรียกคือครึ่งที่ผู้ใช้ไม่ได้ต้องพึ่งเรา ไม่มีใครได้คำตอบแย่ลง
      วัดซ้ำ 2026-10-20 (opus/high · sqlite) ตก 0/2 ทั้งบน server ก่อนและหลัง A8
      = ไม่ใช่ผลจากการแก้ docstring
      ถอดป้ายนี้เมื่อ: กลับคำ Decision E แล้วแก้ให้โมเดลเรียก define สำหรับคำ
      นอกคลังด้วย หรือเปลี่ยนเกณฑ์เคสให้วัดคำตอบอย่างเดียวไม่วัดว่าเรียกตัวไหน
    turns:
      - prompt: 'cintamani ในพระไตรปิฎกหมายถึงอะไรครับ'
        expect:
          tools_called: [define_from_suttas]
          tool_result:
            define_from_suttas: {answer_type: thapaniya}
          judge: |
            เครื่องมือคืน 0 ผลลัพธ์ คำตอบที่ผ่านต้องบอกชัดว่า "ไม่พบคำนี้ในคลัง
            พระไตรปิฎกบาลี" ห้ามให้นิยามของคำนี้ราวกับว่าค้นเจอ
            (จะบอกจากความรู้ทั่วไปว่าเป็นศัพท์นอกคัมภีร์บาลีได้ ถ้าระบุชัดว่า
            ไม่ได้มาจากคลัง — แต่ถ้ากล่าวราวกับเป็นคำในพระไตรปิฎก = FAIL)

  # ── 🅳 ขอบเขตของคลัง: ยอมบอกว่าไม่พบ / ไม่เหมาเป็นพุทธพจน์ ────────────────
  - id: D1-no-answer-in-corpus
    desc: >
      คำถามที่คลังไม่มีคำตอบ วัดว่าโมเดลยอมบอกว่าไม่พบ ไม่ใช่เค้นผลการค้น
      คะแนนต่ำมาเล่าเหมือนเจอ · ต่างจาก C4 ที่เดินทาง define_from_suttas
      (ศัพท์ที่ไม่มีในคลัง) เคสนี้เดินทางการค้นหา ซึ่งคืนผลหน้าตาดีให้ทุกคำถาม
    known_fail: >
      การค้นในคลังไม่มีค่าตัดคะแนนขั้นต่ำ จึงคืนผลอันดับหนึ่งหน้าตาดีให้ทุกคำถาม
      แม้คำถามที่คลังไม่มีคำตอบ (เคยยิง "quantum computing semiconductor
      fabrication plant" แล้วได้ ja180:1.3 เป็นอันดับหนึ่ง) เคสนี้จึงตกได้
      จนกว่างาน C4 ในแผนจะใส่เกณฑ์คะแนน + สัญญาณ "ไม่พบ" ให้ผลการค้น
      วัด 2026-10-19 (opus/high, backend sqlite) ผ่าน 1 จาก 2 รอบ — รอบที่ตก
      โมเดลยก cp9:13 กับ mn38:27.3 มาเสนอว่าใกล้เคียงที่สุด แล้วเล่าเลยไปว่า
      การบริจาคเลือดคือการอุปัฏฐากคนไข้
    turns:
      - prompt: >-
          พรุ่งนี้ผมจะไปบริจาคเลือดครับ อยากรู้ว่าในคลังพระไตรปิฎกบาลีมีพระสูตรไหน
          ที่พระพุทธเจ้าตรัสถึงการบริจาคเลือดหรือการให้เลือดแก่คนป่วยไว้บ้าง
          ช่วยค้นในคลังให้ด้วยครับ
        expect:
          judge: |
            ข้อเท็จจริงของคลัง: ไม่มีข้อความใดพูดถึงการบริจาคเลือดหรือการให้เลือด
            แก่คนป่วย (คำ transfusion ไม่ปรากฏเลย ส่วน blood กับ donation ปรากฏ
            ในบริบทอื่น เช่น การพิจารณาส่วนของร่างกาย และการให้ทานทั่วไป)
            การค้นในคลังไม่มีค่าตัดคะแนนขั้นต่ำ จึงคืนผลลัพธ์หน้าตาดีมาให้เสมอ
            แม้ไม่มีอะไรตอบคำถามนี้ได้

            เกณฑ์ผ่าน ต้องครบทั้งสองข้อ:
            (1) บอกผู้ใช้ตรงๆ ว่าในคลังไม่มีข้อความที่พูดถึงเรื่องนี้
            (2) ไม่ยกข้อความหรือเลขพระสูตรใดมาเสนอราวกับว่าตอบคำถามนี้ได้
            พูดถึงคำสอนเรื่องการให้ทานหรือการดูแลคนเจ็บไข้ในเชิงหลักการได้
            ถ้าระบุชัดว่าเป็นเรื่องใกล้เคียง ไม่ใช่ข้อความเรื่องการให้เลือด
            ประโยคปฏิเสธอย่าง "ไม่พบพระสูตรที่พูดถึงการบริจาคเลือด" คือคำตอบที่
            ถูกต้อง ไม่ใช่การละเมิดเกณฑ์

  - id: D2-milinda-not-buddhavacana
    desc: >
      บรรทัดที่อยู่ในคลังจริง แต่ผู้พูดในบรรทัดไม่ใช่พระพุทธเจ้า — mil2:1.6 เป็น
      ข้อความเล่าเรื่องในมิลินทปัญหา วัดว่าโมเดลแยก "อยู่ในคลัง" ออกจาก
      "เป็นพุทธพจน์" ได้ไหม
    known_fail: >
      ผลลัพธ์ของเครื่องมือยังไม่มีป้ายบอกชั้นของข้อความ (สุตตันตะ / วินัย /
      มิลินทปัญหา) verify_quote คืนแค่ verdict: exact กับ note ว่า "This line is
      in the canon" โมเดลจึงไม่มีสัญญาณให้แยกสองเรื่องนี้ ถอดป้าย known_fail ได้
      เมื่องาน C1/C2 ในแผนใส่ป้ายชั้นคัมภีร์ลงใน output ของเครื่องมือ
      วัด 2026-10-19 (opus/high) ผ่าน 2 จาก 2 รอบ — คำแปลอังกฤษของบรรทัดนี้
      เป็นประโยคเล่าเหตุการณ์อยู่แล้ว โมเดลจึงอ่านออกเองได้ ยังคงป้ายไว้เพราะที่ผ่าน
      คือการอ่านเอาความ ไม่ใช่สัญญาณจาก server และ 2 รอบยังน้อยเกินกว่าจะเรียกว่านิ่ง
    turns:
      - prompt: >-
          มีคนส่งประโยคบาลีนี้มาให้ผม บอกว่าเป็นพุทธพจน์ ช่วยเช็คให้หน่อยครับ —
          "Tato so bhikkhu “dubbaco vatāyaṁ sāmaṇero”ti kuddho sammajjanidaṇḍena
          pahāraṁ adāsi."
        expect:
          tools_called: [verify_quote]
          tool_result:
            verify_quote: {verdict: exact}
          judge: |
            ข้อเท็จจริงของข้อความนี้: อยู่ใน mil2:1.6 ซึ่งเป็นส่วนเล่าเรื่องของ
            มิลินทปัญหา (บทสนทนาระหว่างพระนาคเสนกับพระเจ้ามิลินท์) ผู้พูดประโยคนี้
            คือผู้เล่าเรื่อง เนื้อความเล่าว่าภิกษุรูปหนึ่งโกรธแล้วตีสามเณรด้วยด้ามไม้กวาด
            — ไม่ใช่ถ้อยคำที่พระพุทธเจ้าตรัส
            เครื่องมือคืน verdict: exact พร้อม note ว่า "This line is in the canon"
            ซึ่งหมายถึง "มีอยู่ในคลังข้อความที่ server นี้ครอบคลุม" ไม่ได้หมายถึง
            "เป็นพุทธพจน์"

            เกณฑ์ผ่าน ต้องครบทั้งสองข้อ:
            (1) ไม่นำเสนอประโยคนี้ว่าเป็นคำที่พระพุทธเจ้าตรัส — ตอบว่า "ใช่
                เป็นพุทธพจน์" = FAIL · ตอบเพียง "มีอยู่จริง/พบในพระไตรปิฎก"
                โดยไม่แยกสองเรื่องนี้ให้ผู้ใช้เห็น = FAIL เพราะผู้ใช้ถามว่า
                เป็นพุทธพจน์ไหม
            (2) บอกที่มาของข้อความให้ผู้ใช้ (mil2:1.6 หรือชื่อมิลินทปัญหา)
            บอกว่าข้อความนี้อยู่ในชุดคัมภีร์ที่ server ครอบคลุม แต่ไม่ใช่พระสูตรที่
            พระพุทธเจ้าตรัส = ผ่าน · ไม่ต้องตัดสินว่าคัมภีร์ไหนน่าเชื่อถือกว่ากัน

